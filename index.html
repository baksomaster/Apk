        async function loadStateFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('app_store')
                    .select('*')
                    .eq('id', 'main')
                    .single();

                const today = getTodayDateString();

                if (data && data.payload) {
                    const parsed = data.payload;
                    const savedDate = parsed.lastActiveDate;

                    if (savedDate !== today) {
                        state = {
                            ...defaultState,
                            lastActiveDate: today,
                            settings: parsed.settings ? { ...defaultState.settings, ...parsed.settings } : defaultState.settings,
                            categories: parsed.categories && parsed.categories.length > 0 ? parsed.categories : defaultState.categories,
                            products: parsed.products && parsed.products.length > 0 ? parsed.products : defaultState.products,
                            users: parsed.users && parsed.users.length > 0 ? parsed.users : defaultState.users,
                            expenses: [],
                            transactions: [],
                            auditLogs: [
                                { 
                                    id: `log-${Date.now()}`, 
                                    timestamp: `${today} 00:00:01`, 
                                    user: 'system', 
                                    action: 'DAILY_RESET', 
                                    details: `Penjualan & Belanja dikosongkan otomatis untuk hari baru (${today}).` 
                                },
                                ...(parsed.auditLogs || [])
                            ]
                        };
                        await saveStateToSupabase();
                    } else {
                        state.settings = parsed.settings ? { ...defaultState.settings, ...parsed.settings } : defaultState.settings;
                        state.categories = parsed.categories && parsed.categories.length > 0 ? parsed.categories : defaultState.categories;
                        state.products = parsed.products && parsed.products.length > 0 ? parsed.products : defaultState.products;
                        state.users = parsed.users && parsed.users.length > 0 ? parsed.users : defaultState.users;
                        state.expenses = parsed.expenses || [];
                        state.transactions = parsed.transactions || [];
                        state.auditLogs = parsed.auditLogs || defaultState.auditLogs;
                        state.lastActiveDate = today;
                    }
                } else {
                    await saveStateToSupabase();
                }
            } catch (error) {
                console.error("Gagal memuat data dari Supabase:", error);
            }
        }

        async function saveStateToSupabase() {
            if (!supabaseClient) return;
            try {
                const dataToSave = {
                    lastActiveDate: state.lastActiveDate,
                    settings: state.settings,
                    categories: state.categories,
                    products: state.products,
                    users: state.users,
                    expenses: state.expenses,
                    transactions: state.transactions,
                    auditLogs: state.auditLogs
                };

                const { error } = await supabaseClient
                    .from('app_store')
                    .upsert({ id: 'main', payload: dataToSave, updated_at: new Date() });

                if (error) console.error("Gagal menyimpan ke Supabase:", error.message);
            } catch (error) {
                console.error("Kesalahan koneksi saat menyimpan:", error);
            }
        }

        async function logActivity(action, details) {
            if (!state.currentUser) return;
            const now = new Date();
            const timeStr = now.toISOString().replace('T', ' ').substring(0, 19);
            state.auditLogs.unshift({
                id: `log-${Date.now()}`,
                timestamp: timeStr,
                user: state.currentUser.username,
                action: action,
                details: details
            });
            await saveStateToSupabase();
        }

        function isTransactionEditable(trxTimestamp) {
    // Pastikan string tanggal menggunakan format ISO dengan huruf 'T' (bukan spasi)
    const formattedTimestamp = trxTimestamp.includes(' ') ? trxTimestamp.replace(' ', 'T') : trxTimestamp;
    
    const trxDate = new Date(formattedTimestamp);
    const now = new Date();
    
    // Validasi jika tanggal gagal diparse
    if (isNaN(trxDate.getTime())) return false; 

    const diffMs = now - trxDate;
    const diffHours = diffMs / (1000 * 60 * 60);
    return diffHours <= 1;
}


        function exportToExcel(data, fileName, sheetName) {
            if (typeof XLSX === 'undefined') {
                alert('Library Excel belum dimuat!');
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, sheetName || "Sheet1");
            XLSX.writeFile(workbook, `${fileName}.xlsx`);
        }

                case 'categories': return renderCategoriesTab();
                case 'products': return renderProductsTab();
                case 'expenses': return renderExpensesTab();
                case 'transactions': return renderTransactionsTab();
                case 'sold_items': return renderSoldItemsTab();

        async function editCategoryPrompt(id) {
            const cat = state.categories.find(c => c.id === id);
            if (!cat) return;
            const newName = prompt('Edit Nama Kategori:', cat.name);
            if (newName === null) return;
            const newIcon = prompt('Edit Emoji / Ikon Kategori (contoh: 🍲):', cat.icon);
            if (newIcon === null) return;

            cat.name = newName.trim() || cat.name;
            cat.icon = newIcon.trim() || cat.icon;

            await logActivity('EDIT_KATEGORI', `Mengubah kategori: ${cat.name}`);
            await saveStateToSupabase();
            render();
            alert('Kategori berhasil diperbarui!');
        }

        async function deleteCategory(id) {
            const cat = state.categories.find(c => c.id === id);
            if (!cat) return;
            const productsInCat = state.products.filter(p => p.categoryId === id);
            if (productsInCat.length > 0) {
                alert(`Tidak dapat menghapus kategori "${cat.name}" karena masih terdapat ${productsInCat.length} menu di dalamnya. Hapus atau pindahkan menu tersebut terlebih dahulu.`);
                return;
            }
            if (confirm(`Apakah Anda yakin ingin menghapus kategori "${cat.name}"?`)) {
                state.categories = state.categories.filter(c => c.id !== id);
                if (state.selectedManageCategoryId === id) {
                    state.selectedManageCategoryId = null;
                }
                await logActivity('HAPUS_KATEGORI', `Menghapus kategori: ${cat.name}`);
                await saveStateToSupabase();
                render();
                alert('Kategori berhasil dihapus!');
            }
        }

        function selectManageCategory(id) {
            state.selectedManageCategoryId = state.selectedManageCategoryId === id ? null : id;
            render();

                                                    <button onclick="cancelTransaction('${t.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1 rounded text-xs font-bold transition">Cancel Struk</button>

        function openEditReceiptModal(trxId) {
            const trx = state.transactions.find(x => x.id === trxId);
            if (!trx) return;
            const fullTimestamp = `${trx.date} ${trx.time}:00`;
            if (!isTransactionEditable(fullTimestamp)) {
                alert('Transaksi ini sudah lebih dari 1 jam dan tidak dapat diedit!');
                return;
            }
            state.editingTrx = JSON.parse(JSON.stringify(trx));
            render();
        }

        function closeEditReceiptModal() {
            state.editingTrx = null;
            render();
        }

        function updateEditingQty(productId, delta) {
            if (!state.editingTrx) return;
            const item = state.editingTrx.items.find(i => i.id === productId);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    state.editingTrx.items = state.editingTrx.items.filter(i => i.id !== productId);
                } else {
                    item.subtotal = item.qty * item.price;
                }
                recalcEditingTrxTotal();
                render();
            }
        }

        function removeEditingItem(productId) {
            if (!state.editingTrx) return;
            state.editingTrx.items = state.editingTrx.items.filter(i => i.id !== productId);
            recalcEditingTrxTotal();
            render();
        }

        function addProductToEditingTrx() {
            if (!state.editingTrx) return;
            const prodName = prompt('Ketik nama menu yang ingin ditambahkan:');
            if (!prodName) return;
            const p = state.products.find(x => x.name.toLowerCase().includes(prodName.toLowerCase()));
            if (!p) {
                alert('Menu tidak ditemukan!');
                return;
            }
            const existing = state.editingTrx.items.find(i => i.id === p.id);
            if (existing) {
                existing.qty++;
                existing.subtotal = existing.qty * existing.price;
            } else {
                state.editingTrx.items.push({
                    id: p.id,
                    name: p.name,
                    price: p.price,
                    qty: 1,
                    subtotal: p.price
                });
            }
            recalcEditingTrxTotal();
            render();
        }

        function recalcEditingTrxTotal() {
            if (!state.editingTrx) return;
            const sub = state.editingTrx.items.reduce((acc, curr) => acc + curr.subtotal, 0);
            const tax = (sub * (state.settings.taxPercent || 0)) / 100;
            state.editingTrx.total = sub + tax;
        }

        async function saveEditedTransaction() {
            if (!state.editingTrx) return;
            if (state.editingTrx.items.length === 0) {
                if (!confirm("Item dalam struk kosong. Batalkan/hapus transaksi ini?")) return;
                await cancelTransaction(state.editingTrx.id);
                closeEditReceiptModal();
                return;
            }

            const index = state.transactions.findIndex(t => t.id === state.editingTrx.id);
            if (index !== -1) {
                state.transactions[index] = state.editingTrx;
                await logActivity('EDIT_STRUK', `Mengubah rincian struk transaksi ${state.editingTrx.id}`);
                await saveStateToSupabase();
                alert('Perubahan struk berhasil disimpan dan disinkronkan ke Cloud!');
            }
            closeEditReceiptModal();
            render();
        }

        async function cancelTransaction(trxId) {
            const trx = state.transactions.find(x => x.id === trxId);
            if (!trx) return;
            const fullTimestamp = `${trx.date} ${trx.time}:00`;
            if (!isTransactionEditable(fullTimestamp)) {
                alert('Transaksi ini sudah lebih dari 1 jam dan tidak dapat dibatalkan!');
                return;
            }

            if (confirm(`Apakah Anda yakin ingin MEMBATALKAN/MENHAPUS transaksi ${trx.id}?`)) {
                state.transactions = state.transactions.filter(t => t.id !== trxId);
                await logActivity('CANCEL_STRUK', `Membatalkan & menghapus struk transaksi ${trxId}`);
                await saveStateToSupabase();
                render();
                alert('Transaksi berhasil dibatalkan dan disinkronkan!');
            }
        }

        async function addUserPrompt() {
            const name = prompt('Masukkan Nama Lengkap User:');
            if (!name) return;
            const username = prompt('Masukkan Username (untuk login):');
            if (!username) return;
            const password = prompt('Masukkan Password:');
            if (!password) return;
            const roleInput = prompt('Pilih Role (Admin / Kasir):', 'Kasir');
            const role = (roleInput && roleInput.toLowerCase() === 'admin') ? 'Admin' : 'Kasir';

            state.users.push({
                id: `usr-${Date.now()}`,
                username: username.trim(),
                password: password.trim(),
                name: name.trim(),
                role: role,
                active: true
            });
            await logActivity('TAMBAH_USER', `Menambahkan user baru: @${username} (${role})`);
            await saveStateToSupabase();
            render();
            alert('User berhasil ditambahkan!');
        }

        async function editUserPrompt(id) {
            const u = state.users.find(x => x.id === id);
            if (!u) return;
            const newName = prompt('Edit Nama:', u.name);
            if (newName === null) return;
            const newUsername = prompt('Edit Username:', u.username);
            if (newUsername === null) return;
            const newPassword = prompt('Edit Password (kosongkan jika tetap):', u.password);
            if (newPassword === null) return;
            const newRoleInput = prompt('Edit Role (Admin / Kasir):', u.role);
            if (newRoleInput === null) return;

            u.name = newName.trim() || u.name;
            u.username = newUsername.trim() || u.username;
            if (newPassword.trim() !== '') u.password = newPassword.trim();
            u.role = newRoleInput.toLowerCase() === 'admin' ? 'Admin' : 'Kasir';

            await logActivity('EDIT_USER', `Mengubah data user @${u.username}`);
            await saveStateToSupabase();
            render();
            alert('Data user berhasil diperbarui!');
        }

        async function deleteUser(id) {
            const u = state.users.find(x => x.id === id);
            if (!u) return;
            if (state.currentUser && state.currentUser.id === id) {
                alert('Tidak dapat menghapus akun yang sedang aktif digunakan!');
                return;
            }
            if (confirm(`Hapus user "${u.name}"?`)) {
                state.users = state.users.filter(x => x.id !== id);
                await logActivity('HAPUS_USER', `Menghapus user: @${u.username}`);
                await saveStateToSupabase();
                render();
            }
        }

        function renderSettingsTab() {
            return `
                <div class="max-w-2xl bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h2 class="text-xl font-bold text-slate-900">Pengaturan Identitas Toko</h2>
                        <button onclick="resetDataToDefault()" class="text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Data
                        </button>
                    </div>
                    <form onsubmit="handleSettingsSave(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Nama Toko / Restoran</label>
                            <input id="set-name" type="text" value="${state.settings.storeName}" class="w-full border border-slate-200 rounded p-2 font-bold text-slate-900">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Alamat Lengkap</label>
                            <input id="set-address" type="text" value="${state.settings.address}" class="w-full border border-slate-200 rounded p-2">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Persentase Pajak (%)</label>
                            <input id="set-tax" type="number" step="0.1" min="0" max="100" value="${state.settings.taxPercent}" class="w-full border border-slate-200 rounded p-2 font-bold text-slate-900">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-700 mb-1">Ucapan Terima Kasih (Footer Struk)</label>
                            <textarea id="set-footer" rows="3" class="w-full border border-slate-200 rounded p-2 font-mono">${state.settings.receiptFooter || ''}</textarea>
                        </div>
                        <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2.5 rounded-lg text-xs">Simpan Perubahan</button>
                    </form>
                </div>
            `;
        }

        function renderAuditTab() {
            return `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-slate-900">Audit Log & Catatan Aktivitas</h2>
                    <div class="bg-slate-900 text-slate-200 rounded-xl p-4 font-mono text-xs space-y-2 max-h-96 overflow-y-auto">
                        ${state.auditLogs.map(l => `
                            <div class="border-b border-slate-800 pb-1.5 flex items-start gap-2">
                                <span class="text-slate-500">[${l.timestamp}]</span>
                                <span class="text-cyan-400 font-bold">@${l.user}</span>
                                <span class="text-emerald-400 font-semibold">${l.action}:</span>
                                <span class="text-slate-300">${l.details}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderReceiptModal() {
            const t = state.selectedReceiptTrx;
            if (!t) return '';
            const subtotalTrx = t.items.reduce((acc, item) => acc + item.subtotal, 0);
            const taxTrx = t.total - subtotalTrx;

            return `
                <div class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-slate-900 space-y-4">
                        <div id="receipt-paper" class="bg-amber-50/50 p-4 rounded-lg border border-slate-200 font-mono text-xs space-y-3">
                            <div class="text-center space-y-1">
                                <div class="font-extrabold text-base">${state.settings.storeName}</div>
                                <div class="text-[10px] text-slate-600">${state.settings.address}</div>
                            </div>
                            <div class="border-b border-dashed border-slate-400"></div>
                            <div class="space-y-1 text-[11px]">
                                ${t.items.map(it => `<div class="flex justify-between"><span>${it.qty}x ${it.name}</span><span>${formatRupiah(it.subtotal)}</span></div>`).join('')}
                            </div>
                            <div class="border-b border-dashed border-slate-400"></div>
                            <div class="space-y-1 text-[11px]">
                                <div class="flex justify-between text-slate-600"><span>Subtotal:</span><span>${formatRupiah(subtotalTrx)}</span></div>
                                <div class="flex justify-between text-slate-600"><span>Pajak (${state.settings.taxPercent || 0}%):</span><span>${formatRupiah(taxTrx)}</span></div>
                            </div>
                            <div class="border-b border-dashed border-slate-400"></div>
                            <div class="space-y-1 text-[11px]">
                                <div class="flex justify-between font-bold"><span>Metode Bayar:</span><span>${t.paymentMethod || 'Tunai'}</span></div>
                                ${t.paymentMethod === 'Tunai' ? `
                                    <div class="flex justify-between text-slate-600"><span>Uang Bayar:</span><span>${formatRupiah(t.amountPaid || t.total)}</span></div>
                                    <div class="flex justify-between text-slate-600"><span>Kembalian:</span><span>${formatRupiah(t.changeAmount || 0)}</span></div>
                                ` : `
                                    <div class="flex justify-between text-slate-600"><span>Keterangan:</span><span>${t.paymentMethod.toUpperCase()}</span></div>
                                `}
                            </div>
                            <div class="border-b border-dashed border-slate-400"></div>
                            <div class="flex justify-between font-extrabold text-sm"><span>TOTAL:</span><span>${formatRupiah(t.total)}</span></div>
                            <div class="border-b border-dashed border-slate-400"></div>
                            <div class="text-center text-[10px] text-slate-600 whitespace-pre-line pt-1">
                                ${state.settings.receiptFooter || 'Terima Kasih Atas Kunjungan Anda!'}
                            </div>
                        </div>
                        <div class="flex gap-2 no-print">
                            <button onclick="window.print()" class="flex-1 bg-cyan-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Cetak Struk</button>
                            <button onclick="closeReceiptModal()" class="bg-slate-100 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-xs">Tutup</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleSidebar() { state.isSidebarOpen = !state.isSidebarOpen; render(); }
        
        function handleLoginSubmit(e) { 
            e.preventDefault(); 
            loginUser(document.getElementById('login-username').value.trim(), document.getElementById('login-password').value.trim());
        }

        function loginUser(username, password) {
            const user = state.users.find(u => u.username === username);
            if (!user) { alert('Username salah atau tidak terdaftar.'); return; }
            if (!user.active) { alert('Akun ini sedang dinonaktifkan.'); return; }
            if (user.password !== password) { alert('Password salah!'); return; }
            state.currentUser = user;
            state.activeTab = user.role === 'Admin' ? 'dashboard' : 'pos';
            render();
        }

        function handleLogout() { state.currentUser = null; state.cart = []; render(); }
        function switchTab(tab) { state.activeTab = tab; state.isSidebarOpen = false; render(); }
        function selectCategory(c) { state.selectedCategory = c; render(); }
        function handleSearchInput(q) { state.searchQuery = q; render(); }
        
        function addToCart(id) {
            const p = state.products.find(x => x.id === id);
            const item = state.cart.find(x => x.id === id);
            if (item) { item.qty++; item.subtotal = item.qty * item.price; }
            else { state.cart.push({ id: p.id, name: p.name, price: p.price, qty: 1, subtotal: p.price }); }
            render();
        }
        function updateCartQty(id, d) {
            const item = state.cart.find(x => x.id === id);
            if (item) { item.qty = Math.max(1, item.qty + d); item.subtotal = item.qty * item.price; render(); }
        }
        function updateAmountPaid(val) {
    state.amountPaid = val;
    
    // Hitung ulang total belanja
    const cartSubtotal = state.cart.reduce((acc, item) => acc + item.subtotal, 0);
    const cartTax = (cartSubtotal * (state.settings.taxPercent || 0)) / 100;
    const cartTotal = cartSubtotal + cartTax;
    
    // Hitung kembalian
    const amountPaidNum = parseFloat(val) || 0;
    const changeAmount = amountPaidNum - cartTotal;
    
    // Update tampilan kembalian secara real-time tanpa kehilangan fokus input
    const changeDisplay = document.getElementById('change-amount-display');
    if (changeDisplay) {
        changeDisplay.textContent = changeAmount >= 0 ? formatRupiah(changeAmount) : 'Uang Kurang';
        changeDisplay.className = `font-extrabold ${changeAmount >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
    }
}

        function updateCartPrice(id, p) {
            const item = state.cart.find(x => x.id === id);
            if (item) { item.price = parseFloat(p) || 0; item.subtotal = item.qty * item.price; render(); }
        }
        function removeFromCart(id) { state.cart = state.cart.filter(x => x.id !== id); render(); }
        
        async function handleCheckout() {
            if (state.cart.length === 0) return;
            const subtotal = state.cart.reduce((a, b) => a + b.subtotal, 0);
            const tax = (subtotal * (state.settings.taxPercent || 0)) / 100;
            const total = subtotal + tax;
            let amountPaid = total;
            let changeAmount = 0;

            if (state.paymentMethod === 'Tunai') {
                amountPaid = parseFloat(state.amountPaid) || 0;
                if (amountPaid < total) { alert('Uang yang dibayarkan kurang dari total pembelian!'); return; }
                changeAmount = amountPaid - total;
            }
            
            const trx = {
                id: `TRX-${Date.now().toString().slice(-6)}`,
                date: getTodayDateString(),
                time: new Date().toTimeString().substring(0, 5),
                cashierName: state.currentUser.name,
                items: [...state.cart],
                total: total,
                paymentMethod: state.paymentMethod,
                amountPaid: amountPaid,
                changeAmount: changeAmount
            };
            
            state.transactions.unshift(trx);
            state.selectedReceiptTrx = trx;
            state.cart = [];
            state.amountPaid = '';
            state.paymentMethod = 'Tunai';
            
            await logActivity('TRANSAKSI_BARU', `Membuat transaksi baru ${trx.id} senilai ${formatRupiah(total)}`);
            await saveStateToSupabase();
            render();
        }

        function openReceiptModal(id) { state.selectedReceiptTrx = state.transactions.find(x => x.id === id); render(); }
        function closeReceiptModal() { state.selectedReceiptTrx = null; render(); }
        
        async function addCategoryPrompt() {
            const name = prompt('Nama Kategori Baru:');
            if (!name) return;
            const icon = prompt('Masukkan Emoji Ikon Kategori (contoh: 🍜):', '🍲');
            state.categories.push({ id: `cat-${Date.now()}`, name: name.trim(), icon: icon ? icon.trim() : '🍲' }); 
            await saveStateToSupabase(); 
            render();
            alert('Kategori berhasil ditambahkan!');
        }

        async function addProductPrompt() {
            const name = prompt('Nama Menu:');
            if (!name) return;
            const price = prompt('Harga:', '15000');
            if (!price) return;
            let categoryOptions = state.categories.map((c, idx) => `${idx + 1}. ${c.name}`).join('\n');
            let catIndexInput = prompt(`Pilih Kategori untuk menu "${name}":\n${categoryOptions}\n\nMasukkan nomor kategori:`, '1');
            let selectedCat = state.categories[0];
            if (catIndexInput) {
                let idx = parseInt(catIndexInput) - 1;
                if (state.categories[idx]) selectedCat = state.categories[idx];
            }

            state.products.push({ 
                id: `prod-${Date.now()}`, 
                categoryId: selectedCat.id, 
                name, 
                price: parseFloat(price) || 0, 
                status: 'Tersedia', 
                image: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=300&auto=format&fit=crop&q=80', 
                description: 'Menu spesial.' 
            });
            await saveStateToSupabase(); 
            render();
            alert('Menu baru berhasil ditambahkan!');
        }

        async function addProductToCategoryPrompt(categoryId) {
            const cat = state.categories.find(c => c.id === categoryId);
            if (!cat) return;
            const name = prompt(`Nama Menu Baru untuk Kategori "${cat.name}":`);
            if (!name) return;
            const price = prompt('Harga:', '15000');
            if (!price) return;

            state.products.push({ 
                id: `prod-${Date.now()}`, 
                categoryId: cat.id, 
                name, 
                price: parseFloat(price) || 0, 
                status: 'Tersedia', 
                image: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=300&auto=format&fit=crop&q=80', 
                description: 'Menu spesial.' 
            });
            await saveStateToSupabase(); 
            render();
            alert('Menu berhasil ditambahkan!');
        }

        async function deleteProduct(id) { 
            if (confirm('Hapus menu ini?')) { 
                state.products = state.products.filter(x => x.id !== id); 
                await saveStateToSupabase(); 
                render(); 
            } 
        }

        async function addExpensePrompt() {
            const name = prompt('Nama Pengeluaran:');
            const amount = prompt('Nominal:', '10000');
            if (name && amount) {
                state.expenses.unshift({ id: `exp-${Date.now()}`, name, amount: parseFloat(amount) || 0 });
                await saveStateToSupabase(); 
                render();
            }
        }

        async function toggleUserActive(id) {
            const u = state.users.find(x => x.id === id);
            if (u) { 
                u.active = !u.active; 
                await saveStateToSupabase(); 
                render(); 
            }
        }

        async function handleSettingsSave(e) {
            e.preventDefault();
            state.settings.storeName = document.getElementById('set-name').value;
            state.settings.address = document.getElementById('set-address').value;
            state.settings.taxPercent = parseFloat(document.getElementById('set-tax').value) || 0;
            state.settings.receiptFooter = document.getElementById('set-footer').value;
            
            await saveStateToSupabase(); 
            await logActivity('UPDATE_SETTINGS', 'Memperbarui pengaturan identitas toko.');
            
            alert('Pengaturan toko berhasil disimpan ke cloud!'); 
            render();
        }

        window.onload = async () => {
            await loadStateFromSupabase();
            render();
            
            setInterval(async () => {
                if (supabaseClient && !state.editingTrx) {
                    await loadStateFromSupabase();
                    if (state.currentUser && state.activeTab === 'pos' && state.cart.length === 0) {
                        render();
                    }
                }
            }, 5000);
        };
    </script>
</body>
</html>
